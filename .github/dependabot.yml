version: 2

updates:
  # Action versions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies in pyproject.toml and uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Provider versions in infra/.terraform.lock.hcl
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
