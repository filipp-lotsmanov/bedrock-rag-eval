[project]
name = "bedrock-rag-eval"
version = "0.1.0"
description = "Grounded document QA on AWS Bedrock with a measured retrieval and groundedness evaluation harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "moto[s3]>=5.0",
    "ruff>=0.6",
    "boto3-stubs[bedrock-agent-runtime,bedrock-runtime,s3]>=1.35.0",
    "types-pyyaml>=6.0",
]

# Parser bake-off: candidates plus the sentence splitter used by the metrics.
# Drop the losing parser before week 2.
parsing = [
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "pysbd>=0.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakeoff", "src/ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pysbd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -q"