<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neuroscience paper QA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wrap">
    <div class="titlebar">
      <h1>Neuroscience paper QA</h1>
      <button id="auth" class="quiet" type="button" hidden>Sign in</button>
    </div>
    <p class="intro">Answers come only from ten open-access neuroscience papers, with a citation for
      every claim. When the papers don't cover a question, it says so instead of guessing.</p>
    <svg class="neuron" viewBox="0 0 700 44" aria-hidden="true" focusable="false">
      <path class="cell" pathLength="1000" d="M4 10 L20 22 M4 34 L20 22 M2 22 L20 22 M20 22 C140 4 230 40 350 22 S560 6 668 22 M668 22 L692 10 M668 22 L696 22 M668 22 L692 34"/>
      <circle class="soma" cx="20" cy="22" r="6"/>
      <path class="signal" pathLength="1000" d="M20 22 C140 4 230 40 350 22 S560 6 668 22"/>
    </svg>
  </header>

  <main class="wrap">
    <form id="ask" hidden>
      <label for="question">Your question</label>
      <textarea id="question" rows="3" maxlength="500" required
        placeholder="Ask about the papers, for example how a tool performed or what a study found"></textarea>
      <div class="actions">
        <button id="submit" class="primary" type="submit">Ask</button>
        <span id="count" class="hint">0 / 500, Ctrl+Enter to ask</span>
      </div>
      <p class="examples-label" id="examples-label">Or try one of these:</p>
      <ul class="examples" aria-labelledby="examples-label">
        <li><button type="button" data-question="Which skull-stripping tool did the authors recommend for pediatric T2-weighted MRI scans?">Skull stripping in children</button></li>
        <li><button type="button" data-question="Which gut microbe was used to infect the cultured intestinal and neuronal cells?">Gut microbes and Parkinson's</button></li>
        <li><button type="button" data-question="At what sampling rate were the HD-sEMG signals recorded?">Muscle signal recording</button></li>
        <li><button type="button" class="decline" data-question="What inter-rater agreement, such as Cohen's kappa, was reported for the manual skull-stripping ground truth?">A question the papers can't answer</button></li>
      </ul>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" hidden>
      <div id="answer" class="answer"></div>
      <h2 id="sources-heading">Sources</h2>
      <ol id="sources" class="sources" aria-labelledby="sources-heading"></ol>
      <p id="meta" class="meta"></p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
