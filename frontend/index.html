<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neuroscience paper QA</title>
  <style>
    /* Palette from histology staining: hematoxylin (blue-violet) for structure and actions,
       eosin (pink) for evidence: citation markers and the sources they point to. */
    :root {
      color-scheme: light;
      --slide: #f7f5fa;
      --panel: #ffffff;
      --ink: #1d1b3a;
      --muted: #5f5d7d;
      --rule: #dedbe9;
      --hematoxylin: #3a3796;
      --hematoxylin-soft: #e9e8f6;
      --eosin: #c2306b;
      --eosin-soft: #fbe8f0;
      --axon: #c9c4e4;
      --warn: #8a5a00;
      --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --slide: #14132a;
        --panel: #1c1b36;
        --ink: #e8e6f5;
        --muted: #a3a1c4;
        --rule: #33315a;
        --hematoxylin: #a9a6f5;
        --hematoxylin-soft: #262552;
        --eosin: #f28db6;
        --eosin-soft: #4d2443;
      --axon: #454178;
        --warn: #e6b866;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--slide); color: var(--ink); font: 1rem/1.55 var(--sans); }
    .wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }

    header.wrap { padding-top: 2.75rem; }
    .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0; font: 600 clamp(1.6rem, 4vw, 2.1rem)/1.15 var(--serif); letter-spacing: -0.01em; }
    .intro { margin: 0.6rem 0 0; color: var(--muted); max-width: 36rem; }

    /* The neuron under the title: drawn once on load, fires while a question is answered. */
    .neuron { display: block; width: 100%; height: auto; margin: 1.4rem 0 1.8rem; overflow: visible; }
    .neuron .cell { fill: none; stroke: var(--axon); stroke-width: 2.5; stroke-linecap: round; }
    .neuron .soma { fill: var(--hematoxylin); }
    .neuron .signal { fill: none; stroke: var(--eosin); stroke-width: 3; stroke-linecap: round;
      stroke-dasharray: 0 1000; opacity: 0; }
    body.firing .neuron .signal { opacity: 1; animation: fire 1.3s linear infinite; }
    @keyframes fire { from { stroke-dasharray: 60 1000; stroke-dashoffset: 0; }
                      to { stroke-dasharray: 60 1000; stroke-dashoffset: -1000; } }
    @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }

    button { font: 600 0.95rem var(--sans); border-radius: 999px; cursor: pointer; }
    .primary { color: var(--panel); background: var(--hematoxylin); border: 0; padding: 0.6rem 1.4rem; }
    .primary:hover { filter: brightness(1.1); }
    .quiet { color: var(--hematoxylin); background: transparent; border: 1px solid var(--rule); padding: 0.45rem 1rem; }
    .quiet:hover { background: var(--hematoxylin-soft); }
    button:disabled { opacity: 0.6; cursor: progress; }
    :focus-visible { outline: 3px solid var(--eosin); outline-offset: 2px; }

    label { display: block; font-weight: 600; margin-bottom: 0.45rem; }
    textarea {
      width: 100%; font: 1.02rem/1.5 var(--sans); color: var(--ink); background: var(--panel);
      border: 1px solid var(--rule); border-radius: 12px; padding: 0.8rem 0.9rem; resize: vertical;
    }
    textarea:focus { border-color: var(--hematoxylin); outline: none; box-shadow: 0 0 0 3px var(--hematoxylin-soft); }
    .actions { display: flex; align-items: center; gap: 1rem; margin-top: 0.8rem; }
    .hint { color: var(--muted); font-size: 0.85rem; margin-left: auto; }

    .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.1rem 0 0; padding: 0; list-style: none; }
    .examples button {
      font-weight: 500; font-size: 0.88rem; color: var(--ink); background: var(--panel);
      border: 1px solid var(--rule); padding: 0.35rem 0.85rem;
    }
    .examples button:hover { border-color: var(--hematoxylin); background: var(--hematoxylin-soft); }
    .examples .decline { border-style: dashed; }
    .examples-label { color: var(--muted); font-size: 0.88rem; margin: 1.1rem 0 0; }

    .status { min-height: 1.5rem; margin: 1rem 0; color: var(--muted); }
    .status.warn { color: var(--warn); }

    .answer {
      background: var(--panel); border-radius: 14px; padding: 1.3rem 1.5rem;
      font: 1.15rem/1.7 var(--serif); border: 1px solid var(--rule);
      border-left: 4px solid var(--hematoxylin);
    }
    .answer.abstained { font: 1rem/1.6 var(--sans); border-style: dashed; border-left: 1px dashed var(--rule); color: var(--muted); }
    .answer.abstained strong { display: block; color: var(--ink); margin-bottom: 0.2rem; }
    .marker {
      font: 700 0.7rem var(--sans); vertical-align: super; color: var(--eosin);
      background: var(--eosin-soft); border: 0; border-radius: 999px; padding: 0.05rem 0.4rem; margin: 0 0.1rem;
    }
    .marker.linked, .marker:hover { color: var(--panel); background: var(--eosin); }

    h2 { font: 600 1rem var(--sans); margin: 2rem 0 0.6rem; }
    .sources { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
    .sources li { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; transition: border-color 120ms; }
    .sources li.linked { border-color: var(--eosin); }
    .sources summary { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.75rem;
      padding: 0.7rem 0.9rem; cursor: pointer; list-style: none; }
    .sources summary::-webkit-details-marker { display: none; }
    .sources .number { font: 700 0.8rem var(--sans); color: var(--eosin); background: var(--eosin-soft);
      border-radius: 999px; padding: 0.15rem 0.55rem; }
    .sources .where { min-width: 0; overflow-wrap: anywhere; }
    .sources .where a { color: var(--hematoxylin); font-size: 0.88rem; }
    .relevance { display: grid; justify-items: end; gap: 0.2rem; font-size: 0.75rem; color: var(--muted); }
    .relevance .bar { width: 4.5rem; height: 0.35rem; border-radius: 999px; background: var(--hematoxylin-soft); overflow: hidden; }
    .relevance .fill { height: 100%; background: var(--hematoxylin); }
    .sources blockquote { margin: 0; padding: 0 1.1rem 1rem; font: 0.97rem/1.65 var(--serif);
      border-top: 1px solid var(--rule); padding-top: 0.8rem; }
    .meta { margin: 1.5rem 0 3.5rem; color: var(--muted); font-size: 0.85rem; }
    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: no-preference) {
      .neuron .cell { stroke-dasharray: 1000; animation: draw 1.6s ease-out both; }
      .sources details[open] blockquote { animation: reveal 180ms ease-out; }
      @keyframes reveal { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
    }
    @media (prefers-reduced-motion: reduce) {
      body.firing .neuron .signal { animation: none; stroke-dasharray: none; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="titlebar">
      <h1>Neuroscience paper QA</h1>
      <button id="auth" class="quiet" type="button" hidden>Sign in</button>
    </div>
    <p class="intro">Answers come only from ten open-access neuroscience papers, with a citation for
      every claim. When the papers don't cover a question, it says so instead of guessing.</p>
    <svg class="neuron" viewBox="0 0 700 44" aria-hidden="true" focusable="false">
      <path class="cell" pathLength="1000" d="M4 10 L20 22 M4 34 L20 22 M2 22 L20 22 M20 22 C140 4 230 40 350 22 S560 6 668 22 M668 22 L692 10 M668 22 L696 22 M668 22 L692 34"/>
      <circle class="soma" cx="20" cy="22" r="6"/>
      <path class="signal" pathLength="1000" d="M20 22 C140 4 230 40 350 22 S560 6 668 22"/>
    </svg>
  </header>

  <main class="wrap">
    <form id="ask" hidden>
      <label for="question">Your question</label>
      <textarea id="question" rows="3" maxlength="500" required
        placeholder="Ask about the papers, for example how a tool performed or what a study found"></textarea>
      <div class="actions">
        <button id="submit" class="primary" type="submit">Ask</button>
        <span id="count" class="hint">0 / 500, Ctrl+Enter to ask</span>
      </div>
      <p class="examples-label" id="examples-label">Or try one of these:</p>
      <ul class="examples" aria-labelledby="examples-label">
        <li><button type="button" data-question="Which skull-stripping tool did the authors recommend for pediatric T2-weighted MRI scans?">Skull stripping in children</button></li>
        <li><button type="button" data-question="Which gut microbe was used to infect the cultured intestinal and neuronal cells?">Gut microbes and Parkinson's</button></li>
        <li><button type="button" data-question="At what sampling rate were the HD-sEMG signals recorded?">Muscle signal recording</button></li>
        <li><button type="button" class="decline" data-question="What inter-rater agreement, such as Cohen's kappa, was reported for the manual skull-stripping ground truth?">A question the papers can't answer</button></li>
      </ul>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" hidden>
      <div id="answer" class="answer"></div>
      <h2 id="sources-heading">Sources</h2>
      <ol id="sources" class="sources" aria-labelledby="sources-heading"></ol>
      <p id="meta" class="meta"></p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
